<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07151b" />
    <script>
      (() => {
        const storageKey = "app-theme-preference"
        const legacyKey = "theme"
        const stored = localStorage.getItem(storageKey)
        const legacy = localStorage.getItem(legacyKey)
        const preference = ["system", "light", "dark"].includes(stored) ? stored : ["light", "dark"].includes(legacy) ? legacy : "system"
        const resolved = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference
        document.documentElement.classList.add(resolved)
        document.documentElement.dataset.theme = resolved
        document.documentElement.dataset.themePreference = preference
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
    <title>碳数据收集与管理系统</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
