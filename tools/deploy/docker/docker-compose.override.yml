x-development-volumes: &development-volumes
  volumes:
    - ../../../docs:/workspace/app/docs/
    - ../../../tools:/workspace/app/tools/
    - ../../../src:/workspace/app/src/
    - ../../../Makefile:/workspace/app/Makefile
    - ../../../pyproject.toml:/workspace/app/pyproject.toml
    - ../../../uv.lock:/workspace/app/uv.lock
    - .env.docker:/workspace/app/.env

services:
  app:
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.dev
    ports:
      - "18100:8000"
    tty: true
    environment:
      VITE_DEV_MODE: "true"
      VITE_PORT: "18101"
      PYTHONPATH: "/workspace/app/src/py"
      SAQ_USE_SERVER_LIFESPAN: "false"
    command: granian --interface asgi --factory app.server.asgi:create_app --host 0.0.0.0 --port 8000 --reload --reload-paths /workspace/app/src/py
    restart: always
    <<: *development-volumes
  worker:
    profiles:
      - worker
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.dev
    command: saq app.lib.worker.saq_worker_settings --workers ${SAQ_PROCESSES:-1}
    tty: true
    restart: always
    environment:
      PYTHONPATH: "/workspace/app/src/py"
    <<: *development-volumes
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

    env_file:
      - .env.docker
  migrator:
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.dev
    command: litestar database upgrade --no-prompt
    restart: "no"
    environment:
      PYTHONPATH: "/workspace/app/src/py"
    <<: *development-volumes
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
