services:
  cache:
    image: valkey/valkey:latest
    ports:
      - "18103:6379"
    hostname: cache
    command: redis-server --appendonly yes
    volumes:
      - cache-data:/data
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 1s
      timeout: 3s
      retries: 30
  sentinel:
    image: ghcr.io/altcha-org/sentinel:latest
    ports:
      - "18108:8080"
    hostname: sentinel
    volumes:
      - sentinel-data:/data
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - netstat -ltn | grep -q ':8080 '
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:latest
    ports:
      - "18102:5432"
    hostname: db
    environment:
      POSTGRES_PASSWORD: "app"
      POSTGRES_USER: "app"
      POSTGRES_DB: "app"
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - app
      interval: 2s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "18104:8025"  # Web UI
      - "18105:1025"  # SMTP server
    hostname: mailpit
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget --no-verbose --tries=1 --spider http://localhost:8025/livez || exit 1"
      interval: 10s
      timeout: 5s
      retries: 3
  app:
    image: ${APP_IMAGE:-project/warehouse-carbon:latest}
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.distroless
    restart: always
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      sentinel:
        condition: service_healthy
    ports:
      - "18100:8000"
    environment:
      VITE_DEV_MODE: "false"
      SAQ_USE_SERVER_LIFESPAN: "false"
    env_file:
      - .env.docker
  worker:
    image: ${APP_IMAGE:-project/warehouse-carbon:latest}
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.distroless
    command: saq app.lib.worker.saq_worker_settings --workers ${SAQ_PROCESSES:-1}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      sentinel:
        condition: service_healthy
    env_file:
      - .env.docker
  migrator:
    image: ${APP_IMAGE:-project/warehouse-carbon:latest}
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.distroless
    restart: "no"
    command: litestar database upgrade --no-prompt
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      sentinel:
        condition: service_healthy
volumes:
  db-data: {}
  cache-data: {}
  sentinel-data: {}
